services:
  - type: web
    name: noetrix-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_MODE
        value: "off"
      - key: LLM_PROVIDER
        value: "groq"
      - key: LLM_MODEL
        value: "openai/gpt-oss-20b"
      - key: LLM_FAST_MODEL
        value: "openai/gpt-oss-20b"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000,https://noetrix.vercel.app"
      - key: GROQ_API_KEY
        sync: false

